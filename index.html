<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Eisenhower Matrix</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --text: #e5e7eb;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --q1: #ef4444;
    --q2: #22c55e;
    --q3: #f59e0b;
    --q4: #64748b;
    --drop: rgba(56,189,248,0.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 13px/1.3 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; overscroll-behavior: none; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; gap: 8px; }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.2px; }
  header .actions { display: flex; gap: 6px; }
  button {
    appearance: none; border: 1px solid #334155; background: var(--panel-2); color: var(--text);
    padding: 6px 9px; border-radius: 7px; font-size: 12px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 600; }
  button:active { transform: scale(0.97); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .task:focus-visible { outline-offset: 1px; }

  #input-area { padding: 0 10px 8px; display: flex; flex-direction: column; gap: 6px; }
  #input-area.collapsed { display: none; }
  textarea {
    width: 100%; min-height: 100px; resize: vertical; background: var(--panel); color: var(--text);
    border: 1px solid #334155; border-radius: 8px; padding: 7px; font: 12px/1.35 -apple-system, system-ui, sans-serif;
  }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 11px; }

  #pool {
    margin: 0 10px 8px; padding: 6px; background: var(--panel); border-radius: 10px; border: 1px solid #334155;
    min-height: 44px; display: flex; flex-wrap: wrap; gap: 6px;
  }
  #pool .pool-label { width: 100%; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; padding: 2px 4px 0; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 6px;
    padding: 0 10px 10px;
  }
  .quadrant {
    background: var(--panel); border-radius: 10px; border: 1px solid #334155;
    padding: 6px; min-height: 160px; display: flex; flex-direction: column;
    transition: background 0.12s, border-color 0.12s;
  }
  .quadrant.drop-target { background: var(--drop); border-color: var(--accent); }
  .quadrant .qhead { display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 4px; color: var(--muted); }
  .quadrant .qhead .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
  .quadrant[data-q="q1"] .dot { background: var(--q1); }
  .quadrant[data-q="q2"] .dot { background: var(--q2); }
  .quadrant[data-q="q3"] .dot { background: var(--q3); }
  .quadrant[data-q="q4"] .dot { background: var(--q4); }
  .quadrant .qbody { flex: 1; display: flex; flex-direction: column; gap: 4px; }

  .task {
    background: var(--panel-2); border: 1px solid #3b4a63; color: var(--text);
    padding: 5px 7px; border-radius: 6px; font-size: 12px; line-height: 1.25;
    touch-action: none; user-select: none; -webkit-user-select: none;
    word-break: break-word; cursor: grab;
  }
  .task.in-pool { background: #334155; }
  .task.dragging { opacity: 0.4; cursor: grabbing; }

  #ghost {
    position: fixed; pointer-events: none; z-index: 9999;
    background: #475569; color: #fff; font-weight: 600;
    padding: 6px 10px; border-radius: 8px; font-size: 13px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transform: translate(-50%, -50%);
    display: none; transition: background 0.1s, color 0.1s;
  }

  .task.insert-before { border-top-color: var(--accent); border-top-width: 2px; }
  .task.insert-after  { border-bottom-color: var(--accent); border-bottom-width: 2px; }

  @media (min-width: 700px) {
    .grid { grid-template-rows: 220px 220px; }
    body { max-width: 900px; margin: 0 auto; }
  }
</style>
</head>
<body>
  <header>
    <h1>Eisenhower Matrix</h1>
    <div class="actions">
      <button id="toggle-input">Input</button>
      <button id="clear-all">Clear</button>
    </div>
  </header>

  <section id="input-area">
    <textarea id="input" placeholder="Paste your todo list — one task per line.&#10;- bullets and numbering are stripped automatically"></textarea>
    <div class="row">
      <button class="primary" id="load">Add tasks</button>
      <span class="hint">Long-press to drag · left edge = delete · right edge = back to Unsorted</span>
    </div>
  </section>

  <div id="pool" class="empty">
    <div class="pool-label">Unsorted</div>
  </div>

  <div class="grid">
    <div class="quadrant" data-q="q1">
      <div class="qhead"><span class="dot"></span>Urgent · Important · Do</div>
      <div class="qbody" data-drop="q1"></div>
    </div>
    <div class="quadrant" data-q="q2">
      <div class="qhead"><span class="dot"></span>Not Urgent · Important · Schedule</div>
      <div class="qbody" data-drop="q2"></div>
    </div>
    <div class="quadrant" data-q="q3">
      <div class="qhead"><span class="dot"></span>Urgent · Not Important · Delegate</div>
      <div class="qbody" data-drop="q3"></div>
    </div>
    <div class="quadrant" data-q="q4">
      <div class="qhead"><span class="dot"></span>Not Urgent · Not Important · Delete</div>
      <div class="qbody" data-drop="q4"></div>
    </div>
  </div>

  <div id="ghost"></div>

<script>
(() => {
  const STORAGE_KEY = "eisenhower.v1";
  const pool = document.getElementById("pool");
  const quadrants = {
    pool,
    q1: document.querySelector('[data-drop="q1"]'),
    q2: document.querySelector('[data-drop="q2"]'),
    q3: document.querySelector('[data-drop="q3"]'),
    q4: document.querySelector('[data-drop="q4"]'),
  };
  const ghost = document.getElementById("ghost");

  /** state: { id, text, zone } */
  let tasks = load();
  render();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const data = raw ? JSON.parse(raw) : null;
      if (Array.isArray(data)) {
        return data.filter(t => t && typeof t.id === "string" && typeof t.text === "string");
      }
    } catch {}
    return [];
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch {}
  }

  function uid() { return Math.random().toString(36).slice(2, 10); }

  function parseInput(raw) {
    // Strip in order: leading whitespace, list bullets, then checklist markers (which may follow a bullet).
    // Handles Apple Notes / Markdown / Unicode checkboxes: [ ], [x], ☐ ☑ ☒ ◯ ◉ ●.
    return raw.split(/\r?\n/)
      .map(l => {
        let s = l.trim();
        // strip leading bullet / numbering
        s = s.replace(/^([-*•·–—]|\d+[.)])\s+/, "");
        // strip leading markdown task brackets like "[ ]", "[x]", "[-]", "[>]"
        s = s.replace(/^\[[^\]]?\]\s*/, "");
        // strip leading unicode checkbox glyphs
        s = s.replace(/^[☐☑☒◯◉●○•]\s*/, "");
        // a bullet may have preceded the checkbox; sweep once more
        s = s.replace(/^([-*•·–—])\s+/, "");
        return s.trim();
      })
      .filter(Boolean);
  }

  document.getElementById("load").addEventListener("click", () => {
    const ta = document.getElementById("input");
    const lines = parseInput(ta.value);
    if (!lines.length) return;
    for (const text of lines) tasks.push({ id: uid(), text, zone: "pool" });
    ta.value = "";
    save(); render();
    document.getElementById("input-area").classList.add("collapsed");
  });

  document.getElementById("toggle-input").addEventListener("click", () => {
    document.getElementById("input-area").classList.toggle("collapsed");
  });

  document.getElementById("clear-all").addEventListener("click", () => {
    if (!tasks.length) return;
    if (!confirm("Clear all tasks?")) return;
    tasks = [];
    save(); render();
  });

  // Start collapsed if there are already tasks
  if (tasks.length) document.getElementById("input-area").classList.add("collapsed");

  function render() {
    // clear bodies
    for (const k of Object.keys(quadrants)) {
      const el = quadrants[k];
      // pool keeps its label; for quadrants we have qbody with no children
      if (k === "pool") {
        [...el.querySelectorAll(".task")].forEach(n => n.remove());
      } else {
        el.innerHTML = "";
      }
    }
    for (const t of tasks) {
      const zone = quadrants[t.zone] ? t.zone : "pool";
      quadrants[zone].appendChild(renderTask(t));
    }
    pool.classList.toggle("empty", !tasks.some(t => t.zone === "pool"));
  }

  function renderTask(t) {
    const el = document.createElement("div");
    el.className = "task" + (t.zone === "pool" ? " in-pool" : "");
    el.dataset.id = t.id;
    el.tabIndex = 0;
    el.textContent = t.text;
    attachDrag(el);
    el.addEventListener("keydown", onTaskKey);
    return el;
  }

  const ZONE_ORDER = ["pool", "q1", "q2", "q3", "q4"];

  function onTaskKey(e) {
    const id = e.currentTarget.dataset.id;
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    if (e.key === "Delete" || e.key === "Backspace") {
      e.preventDefault();
      tasks = tasks.filter(x => x.id !== id);
      save(); render();
      return;
    }
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      const dir = e.key === "ArrowRight" ? 1 : -1;
      const zi = ZONE_ORDER.indexOf(t.zone);
      const next = ZONE_ORDER[(zi + dir + ZONE_ORDER.length) % ZONE_ORDER.length];
      reorderTask(id, next, null);
      focusTask(id);
      return;
    }
    if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      e.preventDefault();
      const dir = e.key === "ArrowDown" ? 1 : -1;
      const peers = tasks.filter(x => x.zone === t.zone);
      const pos = peers.findIndex(x => x.id === id);
      const newPos = pos + dir;
      if (newPos < 0 || newPos >= peers.length) return;
      const beforeId = dir > 0 ? (peers[newPos + 1]?.id ?? null) : peers[newPos].id;
      reorderTask(id, t.zone, beforeId);
      focusTask(id);
    }
  }

  function focusTask(id) {
    requestAnimationFrame(() => {
      document.querySelector(`.task[data-id="${id}"]`)?.focus();
    });
  }

  const EDGE_WIDTH = 44;
  function inTrashZone(x) { return x <= EDGE_WIDTH + 12; }
  function inReturnZone(x) { return x >= window.innerWidth - (EDGE_WIDTH + 12); }

  // --- Pointer-based drag (works on mouse + touch) ---
  let drag = null;

  function attachDrag(el) {
    el.addEventListener("pointerdown", onDown);
  }

  function onDown(e) {
    const el = e.currentTarget;
    const id = el.dataset.id;
    // Only initiate drag on long-press for touch / immediate for mouse
    const isTouch = e.pointerType === "touch";
    const startX = e.clientX, startY = e.clientY;

    let started = false;
    let moved = false;
    let timer = null;

    let leftTrash = !inTrashZone(e.clientX);
    let leftReturn = !inReturnZone(e.clientX);

    const start = () => {
      started = true;
      el.setPointerCapture(e.pointerId);
      el.classList.add("dragging");
      ghost.textContent = tasks.find(x => x.id === id)?.text || "";
      ghost.style.width = el.getBoundingClientRect().width + "px";
      ghost.style.display = "block";
      moveGhost(e.clientX, e.clientY);
      drag = { id, el, pointerId: e.pointerId };
      document.body.style.overflow = "hidden";
    };

    if (isTouch) {
      timer = setTimeout(start, 180);
    } else {
      start();
    }

    const onMove = (ev) => {
      if (!started) {
        // cancel long-press if finger moves before timer
        if (Math.hypot(ev.clientX - startX, ev.clientY - startY) > 8) {
          clearTimeout(timer);
          el.removeEventListener("pointermove", onMove);
          el.removeEventListener("pointerup", onUp);
          el.removeEventListener("pointercancel", onUp);
        }
        return;
      }
      ev.preventDefault();
      if (Math.hypot(ev.clientX - startX, ev.clientY - startY) > 8) moved = true;
      moveGhost(ev.clientX, ev.clientY);
      if (!inTrashZone(ev.clientX)) leftTrash = true;
      if (!inReturnZone(ev.clientX)) leftReturn = true;
      const armTrash = leftTrash && inTrashZone(ev.clientX);
      const armReturn = !armTrash && leftReturn && inReturnZone(ev.clientX);
      ghost.style.background = armTrash ? "#ef4444" : armReturn ? "#38bdf8" : "";
      ghost.style.color = armTrash ? "#fff" : armReturn ? "#0b1220" : "";
      if (armTrash || armReturn) clearHighlights();
      else highlightInsert(ev.clientX, ev.clientY);
    };

    const onUp = (ev) => {
      clearTimeout(timer);
      el.removeEventListener("pointermove", onMove);
      el.removeEventListener("pointerup", onUp);
      el.removeEventListener("pointercancel", onUp);
      if (!started) return;
      el.classList.remove("dragging");
      ghost.style.display = "none";
      ghost.style.background = "";
      ghost.style.color = "";
      ghost.style.width = "";
      document.body.style.overflow = "";
      clearHighlights();
      // A press without movement (mouse click / long-press-and-release) is a no-op.
      if (moved) {
        const deleting = leftTrash && inTrashZone(ev.clientX);
        const returning = !deleting && leftReturn && inReturnZone(ev.clientX);
        const ins = (deleting || returning) ? null : findInsert(ev.clientX, ev.clientY);
        if (deleting) {
          tasks = tasks.filter(x => x.id !== id);
          save(); render();
        } else if (returning) {
          reorderTask(id, "pool", null);
        } else if (ins) {
          reorderTask(id, ins.zone, ins.beforeId);
        }
      }
      drag = null;
    };

    el.addEventListener("pointermove", onMove);
    el.addEventListener("pointerup", onUp);
    el.addEventListener("pointercancel", onUp);
  }

  function moveGhost(x, y) {
    ghost.style.left = x + "px";
    ghost.style.top = y + "px";
  }

  function findInsert(x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;

    const taskEl = el.closest(".task:not(.dragging)");
    if (taskEl) {
      const zone = taskEl.closest("[data-drop]")?.dataset.drop
                   || (taskEl.closest("#pool") ? "pool" : null);
      if (zone) {
        const rect = taskEl.getBoundingClientRect();
        // Pointer vertically inside the row → compare X (handles wrapped pool).
        // Otherwise compare Y (stacked quadrant tasks above/below).
        const insertBefore = (y >= rect.top && y <= rect.bottom)
          ? (x < rect.left + rect.width / 2)
          : (y < rect.top + rect.height / 2);
        if (insertBefore) return { zone, beforeId: taskEl.dataset.id };
        let next = taskEl.nextElementSibling;
        while (next && !(next.classList.contains("task") && !next.classList.contains("dragging"))) next = next.nextElementSibling;
        return { zone, beforeId: next ? next.dataset.id : null };
      }
    }

    const drop = el.closest("[data-drop]");
    if (drop) return { zone: drop.dataset.drop, beforeId: null };
    if (el.closest("#pool")) return { zone: "pool", beforeId: null };
    return null;
  }

  function highlightInsert(x, y) {
    clearHighlights();
    const ins = findInsert(x, y);
    if (!ins) return;
    if (ins.beforeId) {
      document.querySelector(`.task[data-id="${ins.beforeId}"]`)?.classList.add("insert-before");
    } else {
      const body = ins.zone === "pool" ? pool : document.querySelector(`[data-drop="${ins.zone}"]`);
      const last = body?.querySelector(".task:last-of-type");
      if (last) last.classList.add("insert-after");
      else (ins.zone === "pool" ? pool : document.querySelector(`.quadrant[data-q="${ins.zone}"]`))?.classList.add("drop-target");
    }
  }

  function reorderTask(id, zone, beforeId) {
    const idx = tasks.findIndex(t => t.id === id);
    if (idx === -1) return;
    const [task] = tasks.splice(idx, 1);
    task.zone = zone;
    if (beforeId !== null) {
      const bi = tasks.findIndex(t => t.id === beforeId);
      tasks.splice(bi !== -1 ? bi : tasks.length, 0, task);
    } else {
      tasks.push(task);
    }
    save(); render();
  }

  function clearHighlights() {
    document.querySelectorAll(".drop-target").forEach(n => n.classList.remove("drop-target"));
    document.querySelectorAll(".insert-before, .insert-after").forEach(n => n.classList.remove("insert-before", "insert-after"));
  }
})();
</script>
</body>
</html>
